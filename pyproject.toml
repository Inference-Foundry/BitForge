[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitforge"
version = "0.1.0"
description = "A planned initiative exploring the theory and practice of LLM model quantization"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Inference Foundry Maintainers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "optimum>=1.16.0",
    "auto-gptq>=0.6.0",
    "autoawq>=0.1.8",
    "datasets>=2.15.0",
    "evaluate>=0.4.1",
    "gguf>=0.6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/Inference-Foundry/BitForge"

[project.scripts]
bitforge = "bitforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bitforge*"]
